name: Hypercolor formula

on:
  pull_request:
    paths:
      - "Formula/hypercolor.rb"
      - "Casks/hypercolor-app.rb"
      - ".github/workflows/hypercolor.yml"
  push:
    branches: [main]
    paths:
      - "Formula/hypercolor.rb"
      - "Casks/hypercolor-app.rb"
      - ".github/workflows/hypercolor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formula:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@7f791ee8209b4ed73dd5564b92fea6998e22f5c5
        with:
          stable: true
      - name: Evaluate formula and service with Homebrew
        run: |
          brew tap-new --no-git hypercolor/ci
          cp Formula/hypercolor.rb "$(brew --repository hypercolor/ci)/Formula/hypercolor.rb"
          brew trust --formula hypercolor/ci/hypercolor
          brew info --json=v2 hypercolor/ci/hypercolor
          brew ruby -e '
            require "formulary"
            formula = Formulary.factory("hypercolor/ci/hypercolor")
            service = formula.service.to_hash
            expected = [formula.opt_bin/"hypercolor-daemon"]
            expected += ["--macos-owner", "homebrew"] if OS.mac?
            expected += ["--ui-dir", formula.opt_pkgshare/"ui"]
            abort "Unexpected daemon service command: #{service[:run]}" unless service[:run] == expected
          '
      - name: Refuse macOS installs while macOS is withdrawn
        if: runner.os == 'macOS'
        run: |
          if ! grep -q 'depends_on NotarizedMacosBuildRequirement' Formula/hypercolor.rb; then
            echo "The formula offers a macOS build; nothing to refuse."
            exit 0
          fi
          cache="$(brew --cache hypercolor/ci/hypercolor)"
          if brew install hypercolor/ci/hypercolor > install.log 2>&1; then
            cat install.log
            echo "::error::brew installed the formula on macOS while macOS is withdrawn"
            exit 1
          fi
          cat install.log
          grep -q "waiting on Apple notarization" install.log
          # The requirement must stop the install before any download.
          test ! -e "$cache"
      - name: Evaluate the desktop app cask
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$(brew --repository hypercolor/ci)/Casks"
          cp Casks/hypercolor-app.rb "$(brew --repository hypercolor/ci)/Casks/hypercolor-app.rb"
          brew trust --cask hypercolor/ci/hypercolor-app
          brew info --cask hypercolor/ci/hypercolor-app
          if ! grep -q '^  disable!' Casks/hypercolor-app.rb; then
            exit 0
          fi
          if brew install --cask hypercolor/ci/hypercolor-app > cask-install.log 2>&1; then
            cat cask-install.log
            echo "::error::brew installed the cask while it is disabled"
            exit 1
          fi
          cat cask-install.log
          grep -q "disabled because it is waiting on a notarized release" cask-install.log
